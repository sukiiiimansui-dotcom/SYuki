name: 世界地图 · 多平台编译验证与全平台构建

# 职责边界（重要）：**这个工作流只做验证，不做打包。**
#
#   ① 编译验证 —— 推送/PR 就自动跑：矩阵覆盖 Linux x64 / Linux arm64 / Windows / macOS，
#      目的是尽早抓到「只在某个平台编不过」的代码。
#      这不是假想需求：我们真踩过一次 —— schedule.rs 用 libc::localtime_r 取本地时间，
#      那是 Unix 专属、Windows 上直接编不过；后来又抓到 reqwest 0.13 把 .form() 挪到
#      feature 后面（四个平台同时炸）。多平台矩阵就是为这类问题准备的。
#   ② 前端类型检查 + 构建，③ 世界地图单元测试。
#
# 打包不在这里重复实现，直接用仓库已有的工作流：
#   · APK（我们实际使用的产物）→ build-android.yml（手动触发，带签名、建 Release）
#   · 桌面端安装包              → release.yml / dev-build.yml
# 这样打包逻辑只有一份，不会跟官方工作流各自漂移。
#
# 注意：不要给 checkout 加 `lfs: true` —— 本仓库 .gitattributes 没有 LFS 规则、
# `git lfs ls-files` 为 0，而服务器上又缺 LFS 对象，加了会 404 直接挂。
on:
  push:
    branches: ['feat/**', 'main']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/world_map/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/world-map-check.yml'
  pull_request:
    branches: ['main', 'master']
  workflow_dispatch:

concurrency:
  group: world-map-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────── ① 前端 ─────────────────────────
  frontend:
    name: 前端 · 类型检查 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm i --frozen-lockfile

      - name: TypeScript 类型检查
        run: npx vue-tsc --noEmit --skipLibCheck

      - name: 构建前端
        run: npx vite build

      - name: 世界地图前端模块自检（不依赖手机接口）
        run: |
          node -e "
            const fs=require('fs');
            for (const f of ['world_time.js','world_weather.js','transport.js','npc.js','phone.js']) {
              const p='public/world_map/'+f;
              if (!fs.existsSync(p)) { console.error('缺少 '+p); process.exit(1); }
              const src=fs.readFileSync(p,'utf8');
              if (src.length < 1000) { console.error(p+' 内容异常'); process.exit(1); }
            }
            console.log('✅ 5 个前端模块齐备');
          "

  # ─────────────── ② 多平台编译验证（本次新增的核心）───────────────
  rust-check:
    name: 编译验证 · ${{ matrix.label }}
    needs: frontend
    strategy:
      fail-fast: false          # 一个平台挂了也要看到其余平台的结果
      matrix:
        include:
          - { os: ubuntu-latest,    label: Linux x64 }
          - { os: ubuntu-24.04-arm, label: Linux arm64 }
          - { os: windows-latest,   label: Windows x64 }
          - { os: macos-latest,     label: macOS arm64 }
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Tauri 所需的 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libegl1-mesa-dev \
            libx11-dev libxcb1-dev libxrandr-dev libxcomposite-dev libxcursor-dev \
            libxi-dev libxtst-dev libwayland-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
          cache-targets: true
          cache-on-failure: true
          shared-key: world-map-${{ matrix.os }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # cargo 不会执行 tauri.conf.json 的 beforeBuildCommand，
      # 而 build.rs 会校验 .bundled_resources/ 下的资源（缺了直接报
      # "resource path .bundled_resources/data_manifest.json doesn't exist"）。
      # 该脚本零第三方依赖，直接 node 跑即可。
      - name: 准备 Tauri 打包资源
        run: node scripts/prepare-desktop-resources.mjs

      - name: cargo check（${{ matrix.label }}）
        working-directory: src-tauri
        run: cargo check --lib

  # ─────────────────── ③ 单元测试（只在一个平台跑）───────────────────
  rust-test:
    name: Rust · 世界地图单元测试
    needs: frontend
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Tauri 所需的 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libegl1-mesa-dev \
            libx11-dev libxcb1-dev libxrandr-dev libxcomposite-dev libxcursor-dev \
            libxi-dev libxtst-dev libwayland-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
          cache-targets: true
          cache-on-failure: true
          shared-key: world-map-test

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 准备 Tauri 打包资源
        run: node scripts/prepare-desktop-resources.mjs

      - name: 世界地图单元测试
        working-directory: src-tauri
        run: cargo test --lib world_map -- --nocapture
