name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 0

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      # Rust + android target（cargo-ndk 需要）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
          cache-targets: true
          shared-key: debug-pnpm-tauri-build-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK + NDK
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Linux deps (tauri android 构建工具链)
        run: sudo apt-get update && sudo apt-get install -y build-essential clang

      - name: pnpm install
        run: pnpm i --frozen-lockfile

      - name: Prepare Android project
        run: pnpm android:prepare

      - name: Build APK (debug)
        run: pnpm android:build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingchat-debug-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
