name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 0

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      # Rust + android target（cargo-ndk 需要）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
          cache-targets: true
          shared-key: debug-pnpm-tauri-build-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK + NDK
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Linux deps (tauri android 构建工具链)
        run: sudo apt-get update && sudo apt-get install -y build-essential clang

      - name: pnpm install
        run: pnpm i --frozen-lockfile

      - name: 生成全套图标
        run: pnpm tauri icon src-tauri/icons/icon.png

      # ⚠️ 这一行**绝对不要**改回 `rm -rf src-tauri/gen/android`（2026-09-12 修）
      #
      # 原来那版是「rm -rf gen/android + tauri android init」，注释说"so tauri regenerates
      # with current identifier"。听着合理，实际会**把自写的 Android 文件全删掉**：
      #   · `app/src/main/java/com/syuki/lingchat/location/LocationPlugin.kt`（421 行，GPS 插件本体）
      #   · `AndroidManifest.xml` 里的 ACCESS_FINE_LOCATION / ACCESS_COARSE_LOCATION 权限声明
      #   · proguard 规则等
      # `tauri android init` **不会**把这些重新生成 —— 它只产出一个原版 Android 工程。
      # 后果：打出来的 APK **没有定位能力**（Rust 侧 `loc_android::init()` 注册的插件在
      # Kotlin 侧根本不存在），而 `world_map_location` / 世界模拟的自动定位全靠它。
      #
      # 现在只跑 `pnpm android:prepare`（= `tauri android init` + 生成图标）：
      # `tauri android init` 对**已存在的文件是非破坏性的**（实测：不会覆盖自写 Kotlin），
      # 所以既保留定制、又保证工程结构是最新的。
      # 另外 `build-android.yml` / `dev-build-android.yml` 本来就是这么做的，这里与它们对齐。
      - name: Prepare Android project (保留自写的 Android 文件！)
        run: pnpm android:prepare

      # 必须是 **debug** 包：`tauri android build --apk` 默认出的是 **release**，
      # 而我们没有配置签名 → 未签名 APK **装不上手机**（`adb install` 直接报
      # INSTALL_PARSE_FAILED_NO_CERTIFICATES）。
      - name: Build APK (debug)
        run: node scripts/prepare-bundled-resources.mjs 9 && pnpm tauri android build -d -t aarch64 --apk

      # ⚠️ 必须用**和 release 同一把密钥**重签（2026-09-13 加）
      #
      # 起因：机主手机上已经装着以前打的那个 `com.syuki.lingchat`（用 Secrets 里的
      # `upload-keystore.p12` 签的）。而 Gradle 给 debug 包自动签的是
      # **Android Debug** 密钥 —— 两把密钥不同，Android 直接拒装：
      #     INSTALL_FAILED_UPDATE_INCOMPATIBLE（签名不一致）
      #
      # 解法不是「先卸载旧的」（那会丢掉应用数据），而是**让 debug 包也用同一把密钥签** ——
      # 签名一致就能直接覆盖安装、数据保留。
      #
      # 与 `build-android.yml` 用同一份 secrets 和同一套 apksigner 流程，
      # 只是这里签的是 debug 产物；apksigner 会**替换**掉 Gradle 的调试签名。
      - name: 用 release 密钥重签 debug 包（签名一致才能覆盖安装）
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -e
          if [ -z "${{ secrets.ANDROID_KEY_BASE64 }}" ]; then
            echo "::warning::没有 ANDROID_KEY_BASE64 这个 secret，跳过重签 —— 装的时候需要先卸载旧版"
            exit 0
          fi
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > "$HOME/upload-keystore.p12"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | head -1)
          echo "apksigner: $APKSIGNER"
          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk'); do
            echo "── 重签 $apk"
            "$APKSIGNER" sign \
              --ks "$HOME/upload-keystore.p12" \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              "$apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -6
          done
          rm -f "$HOME/upload-keystore.p12"   # 别把密钥留在 runner 上

      - name: 列出产物（排障用：路径不对时能一眼看出）
        run: find src-tauri/gen/android/app/build/outputs -name '*.apk' -exec ls -la {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingchat-debug-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
